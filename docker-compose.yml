name: order-app

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?thiếu AUTH_DB_PASSWORD trong .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?thiếu APP_DB_PASSWORD trong .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:9999

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

      GOTRUE_JWT_SECRET: ${JWT_SECRET:?thiếu JWT_SECRET trong .env}
      GOTRUE_JWT_EXP: 300
      GOTRUE_JWT_AUD: authenticated
    ports:
      - "127.0.0.1:9999:9999"
    depends_on:
      db:
        condition: service_healthy
  redis:
    image: redis:8.6.4
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?thiếu REDIS_PASSWORD trong .env}",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "${REDIS_PASSWORD}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  centrifugo:
    image: centrifugo/centrifugo:v6.8.1
    restart: unless-stopped
    command: ["centrifugo", "-c", "config.json"]
    volumes:
      - ./docker/centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg_data:
